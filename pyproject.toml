[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-rag"
version = "0.1.0"
description = "Local PDF question answering with Ollama (DeepSeek-R1 + bge-m3), ChromaDB and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11,<0.12",
    "pytesseract>=0.3.10,<0.4",
    "Pillow>=10",
    "langchain-core>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langchain-chroma>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    "chromadb>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pdf-rag = "pdf_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
